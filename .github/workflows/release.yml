name: Release

on:
  push:
    branches:
      - develop
      - master

permissions:
  contents: read
  id-token: write

jobs:
  deploy_dev:
    if: github.ref == 'refs/heads/develop'
    uses: indra-devops-latam/platform-ci-cd/.github/workflows/publish-deploy.yml@develop
    with:
      environment: dev
      ecr_repository: ${{ vars.ECR_REPOSITORY_DEV }}
      eks_cluster: ${{ vars.EKS_CLUSTER_DEV }}
      namespace: ${{ vars.K8S_NAMESPACE_DEV }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  deploy_prod:
    if: github.ref == 'refs/heads/master'
    uses: indra-devops-latam/platform-ci-cd/.github/workflows/publish-deploy.yml@develop
    with:
      environment: prod
      ecr_repository: ${{ vars.ECR_REPOSITORY_PROD }}
      eks_cluster: ${{ vars.EKS_CLUSTER_PROD }}
      namespace: ${{ vars.K8S_NAMESPACE_PROD }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}